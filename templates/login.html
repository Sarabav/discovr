<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovr — Log In</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="app-header">
    <div class="container">
      <h1>Discovr</h1>
      <p class="tagline">Log in to view your AI-visibility dashboard.</p>
    </div>
  </header>

  <main class="container narrow">
    <section class="card">
      <h2>Log In</h2>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash-message">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}

      {% if error %}
        <div class="error-message">{{ error }}</div>
      {% endif %}

      <form method="post">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" value="{{ email or '' }}" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Log In</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="{{ url_for('signup_page') }}">Sign up</a></p>
    </section>
  </main>
</body>
</html>
