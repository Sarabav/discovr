<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovr — Sign Up</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body class="auth-page">
  <div class="auth-glow"></div>

  <main class="auth-shell">
    <a class="auth-logo" href="{{ url_for('landing_page') }}">Discovr</a>

    <section class="card auth-card">
      <h2>Sign Up</h2>

      {% if error %}
        <div class="error-message">{{ error }}</div>
      {% endif %}

      <form method="post" id="signup-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" value="{{ email or '' }}" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" minlength="8" required>
        </div>
        <div class="field">
          <label for="website">Your business website</label>
          <input type="text" id="website" name="website" placeholder="https://yourbusiness.com" required>
        </div>
        <button type="submit">Sign Up</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="{{ url_for('login_page') }}">Log in</a></p>
    </section>
  </main>

  <script src="{{ url_for('static', filename='signup.js') }}"></script>
</body>
</html>
